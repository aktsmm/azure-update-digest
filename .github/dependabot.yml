version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [maintenance]
    commit-message:
      prefix: "build(deps)"
    # Major version jumps of the test/build toolchain (vitest, vite, typescript, @types/node) are not worth the risk here:
    # `npm audit` is clean, and a major bump cannot be verified locally when the registry mirror lags behind. Security
    # fixes still arrive through Dependabot security updates, which ignore this list.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [maintenance]
