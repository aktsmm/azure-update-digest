name: Dispatch slide generation

# Mon and Thu 03:00 JST (= Sun and Wed 18:00 UTC): start slide generation for up to 30 recent updates
# (newest first, last 3 calendar months) that do not have a slide yet. Existing slides are skipped,
# so each run reaches further back. One agentic run is started per update, spaced out to stay polite.
on:
  schedule:
    - cron: "0 18 * * 0,3"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of updates"
        required: false
        default: "30"
        type: string
      ids:
        description: "Comma-separated update IDs to (re)generate instead of the pending list, e.g. 576377,576214"
        required: false
        default: ""
        type: string
      regenerate:
        description: "true to overwrite existing slides for the given ids (adds speaker-notes Q&A)"
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: slide-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit || '30' }}
          IDS: ${{ inputs.ids }}
          REGENERATE: ${{ inputs.regenerate }}
        run: |
          case "$LIMIT" in ''|*[!0-9]*) echo "invalid limit"; exit 1;; esac
          [ "$LIMIT" -gt 30 ] && LIMIT=30
          case "$IDS" in *[!0-9,\ ]*) echo "invalid ids"; exit 1;; esac
          open=$(gh pr list --state open --limit 200 --json headRefName -q '.[].headRefName' | grep -E '^slides[/-]' || true)
          started=0
          if [ -n "$IDS" ]; then
            list=$(echo "$IDS" | tr ',' ' ')
            regen=""; [ "$REGENERATE" = "true" ] && regen="-f regenerate=true"
          else
            list=$(npm run -s pending-slides -- --limit 100 2>/dev/null)
            regen=""
          fi
          for id in $list; do
            [ "$started" -ge "$LIMIT" ] && break
            if echo "$open" | grep -Eq "^slides[/-]$id"; then echo "skip $id: open PR"; continue; fi
            echo "dispatch $id $regen"
            gh workflow run slide.lock.yml -f id="$id" $regen
            started=$((started + 1))
            sleep 60
          done
          echo "started $started"
      - name: Trigger auto-merge after the last agent run has had time to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 900
          gh workflow run auto-merge-slides.yml
