name: Auto-merge slides

# Merges PRs created by the slide agentic workflow once they are provably safe:
# exactly one data/slides/<id>.json, schema/semantic validation and a PDF render check,
# all executed with trusted code from main.
on:
  workflow_run:
    workflows: ["Azure Update Digest — one-update slide JSON"]
    types: [completed]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.run.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Japanese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Validate, render-check and merge eligible PRs
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          merged=false
          for n in $(gh pr list --state open --limit 100 --json number,headRefName,labels \
              -q '.[] | select((.headRefName | startswith("slides/")) and (.labels | map(.name) | index("data"))) | .number'); do
            echo "== PR #$n"
            files=$(gh pr view "$n" --json files -q '.files[].path')
            if [ "$(echo "$files" | wc -l)" -ne 1 ] || ! echo "$files" | grep -Eq '^data/slides/[0-9]{1,12}\.json$'; then
              echo "skip: must change exactly one data/slides/<id>.json:"; echo "$files"; continue
            fi
            f="$files"; id=$(basename "$f" .json)
            git fetch -q origin "pull/$n/head"
            git reset -q --hard origin/main
            git checkout -q FETCH_HEAD -- "$f"
            rm -rf .slide-check && mkdir .slide-check && cp "$f" ".slide-check/$id.json"
            if ! npx tsx src/cli/validate-slides.ts .slide-check; then echo "skip: validation failed"; git reset -q --hard origin/main; continue; fi
            if ! npx tsx src/cli/render-pdf.ts --dir .slide-check --ids "$id" --out .slide-check/out; then echo "skip: render check failed"; git reset -q --hard origin/main; continue; fi
            git reset -q --hard origin/main
            rm -rf .slide-check
            gh pr merge "$n" --squash && merged=true
          done
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

  deploy:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
