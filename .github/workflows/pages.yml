name: Deploy site

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "site/**"
      - "config/**"
      - "package-lock.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data (a failure here keeps the currently published site)
        run: npm run validate
      - name: Build site from data (raw -> normalized -> site)
        run: npm run build
      - name: Render per-update slide PDFs and the PDF font
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          npm run build:pdfs
          npm run protect:pdfs
          pip install -q fonttools brotli
          mkdir -p dist/fonts
          curl -L --fail -o NotoSansJP-VF.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf"
          python scripts/make-font.py NotoSansJP-VF.ttf dist/fonts/NotoSansJP.ttf
          npm run build:api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
